<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Yönetici Girişi | Musab Kanat Izgara</title>
    <link rel="icon" type="image/png" href="images/musab_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #4A3026 0%, #2E1E17 55%, #120b08 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(253, 248, 245, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-area img {
            height: 65px;
            margin-bottom: 10px;
        }
        .logo-area h1 {
            font-size: 1.4rem;
            color: #C48B58;
            font-weight: 600;
        }
        .logo-area p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #C48B58;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #C48B58;
            box-shadow: 0 0 0 2px rgba(196, 139, 88, 0.25);
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #C48B58;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-login:hover {
            filter: brightness(1.1);
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-message {
            background: rgba(217, 83, 79, 0.2);
            border: 1px solid rgba(217, 83, 79, 0.5);
            color: #ff8a80;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link a:hover {
            color: #C48B58;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <img src="images/musab_logo.png" alt="Musab Kanat Logo">
            <h1>Yönetici Girişi</h1>
            <p>Musab Kanat Izgara Yönetim Paneli</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="email">E-Posta Adresi</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required placeholder="admin@musabkanat.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </button>
        </form>

        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Siteye Geri Dön</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.port === '3000' ? 'http://localhost:4000/api' : '/api';

        // Check if already authenticated
        fetch(`${API_BASE}/auth/me`, { credentials: 'include' })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.user && data.user.role === 'ADMIN') {
                    window.location.href = 'admin.html';
                }
            })
            .catch(() => {});

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş yapılıyor...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.user.role !== 'ADMIN') {
                        errorMessage.textContent = 'Bu panele yalnızca yöneticiler erişebilir.';
                        errorMessage.style.display = 'block';
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
                        return;
                    }

                    // Success - redirect to admin panel
                    window.location.href = 'admin.html';
                } else {
                    errorMessage.textContent = data.error?.message || 'Giriş başarısız. Lütfen bilgilerinizi kontrol edin.';
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
                }
            } catch (err) {
                errorMessage.textContent = 'Sunucuya bağlanılamadı. Lütfen backend servisinin çalıştığından emin olun.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Giriş Yap';
            }
        });
    </script>
</body>
</html>
