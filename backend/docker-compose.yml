version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: musabkanat_postgres
    restart: always
    environment:
      POSTGRES_USER: musab_user
      POSTGRES_PASSWORD: musab_password
      POSTGRES_DB: musabkanat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musab_user -d musabkanat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
